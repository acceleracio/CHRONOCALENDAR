            z-index: 9999;

            align-items: center; 
            justify-content: center; 
        }
        #otpForm {

            padding: 30px; 
            border-radius: 8px; 
            text-align: center; 
            min-width: 350px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 10px; }
        h2 { color: #666; margin-bottom: 25px; font-size: 18px; }
        input { 
            width: 90%; 
            padding: 12px; 
            margin: 8px 0;

            border-radius: 5px; 
            font-size: 16px;
        }
        input:focus { border-color: #007bff; outline: none; }
        button { 
            background: #007bff; 
            color: white; 
            padding: 12px 30px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px;
            margin-top: 15px;
            width: 95%;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #error { color: #dc3545; margin: 15px 0; font-weight: bold; }
        #success { color: #28a745; margin: 15px 0; font-weight: bold; }
        #budContent { display: none; width: 100%; height: 100vh; border: none; }
        .loading { display: none; margin: 10px 0; }
        .spinner { 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #007bff; 
            border-radius: 50%; 
            width: 20px; 
            height: 20px; 
            animation: spin 1s linear infinite; 
            display: inline-block;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
