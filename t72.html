<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Management Calendar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }
    .view-toggle, .navigation {
      margin-bottom: 20px;
      text-align: center;
    }
    .calendar {
      width: 100%;
      background-color: #333;
      border-radius: 8px;
      padding: 10px;
      overflow: auto;
    }
    .week-view, .month-view {
      width: 100%;
    }
    .day-block {
      margin-bottom: 15px;
    }
    .day-header {
      font-weight: bold;
      margin-bottom: 5px;
    }
    textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      resize: none;
      overflow: hidden;
      min-height: 50px;
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      color: #fff;
    }
    td, th {
      border: 1px solid #444;
      padding: 8px;
      text-align: center;
      vertical-align: top;
    }
    th {
      background-color: #555;
    }
    .navigation button {
      margin: 5px;
    }
    .date-label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    button {
      background-color: #007BFF;
      border: none;
      border-radius: 8px;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
    button:active {
      background-color: #004080;
      transform: scale(1);
    }
    button:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(38, 143, 255, 0.5);
    }
    .month-view .current-month {
      background-color: red;
    }
    .month-view .other-month {
      background-color: blue;
      color: white;
    }
    .today {
      background-color: yellow !important;
      color: black !important;
    }
    #login-form {
      margin-bottom: 20px;
    }
    #login-form input {
      padding: 10px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #555;
    }
    #user-info {
      margin-bottom: 10px;
    }
    .zoom-controls {
      margin-bottom: 10px;
    }
    #zoom-container {
      width: 100%;
      transform-origin: top left;
    }
  </style>

</head>

<body onload="checkLogin()">

  <div id="zoom-container">
    <div class="container">
      <div id="login-form">
        <input type="email" id="email" placeholder="Enter your Gmail address" required>
        <button onclick="login()">Login</button>
      </div>

      <div id="user-info" style="display: none;">
        Logged in as: <span id="user-email"></span>
        <button onclick="logout()">Logout</button>
      </div>

    
      <div id="calendar-container" style="display: none;">
        <div class="zoom-controls">
          <button onclick="zoom(1.1)">Zoom In</button>
          <button onclick="zoom(0.9)">Zoom Out</button>
        </div>

        <div class="view-toggle">
          <button onclick="showView('week')">Weekly View</button>
          <button onclick="showView('month')">Monthly View</button>
        </div>

        <div class="navigation">
          <button onclick="changePeriod(-1)">Previous</button>
          <button onclick="changePeriod(1)">Next</button>
        </div>

        <div class="calendar week-view" id="week-view" style="display:none;">
          <h2 id="week-title">Weekly View</h2>
          <div id="week-container"></div>
        </div>

        <div class="calendar month-view" id="month-view">
          <h2 id="month-title">Monthly View</h2>
          <table>
            <tr>
              <th>Sun</th>
              <th>Mon</th>
              <th>Tue</th>
              <th>Wed</th>
              <th>Thu</th>
              <th>Fri</th>
              <th>Sat</th>
            </tr>
            <tbody id="month-days"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
